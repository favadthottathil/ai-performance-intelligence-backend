services:
  api:
    build: .
    env_file: .env.docker
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine3.24
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf -d perf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off schema migration. The "tools" profile keeps it out of a plain
  # `docker compose up`; run it with `docker compose run --rm migrate`.
  migrate:
    build: .
    env_file: .env.docker
    command: ["node", "run_migration.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

volumes:
  pgdata:
