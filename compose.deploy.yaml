# Runs the published image plus its own PostgreSQL on any machine with Docker.
# No source code is needed: copy this file and .env.deploy.example (renamed to
# .env) into an empty folder. See DEPLOY.md.
services:
  api:
    image: ghcr.io/favadthottathil/ai-performance-intelligence-backend:${API_TAG:-latest}
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine3.24
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
